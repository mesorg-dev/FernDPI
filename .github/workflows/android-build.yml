name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Configure Cargo linkers (API 26)
        run: |
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK_BIN/armv7a-linux-androideabi26-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK_BIN/x86_64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Rust core for Android
        run: |
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android
          cargo build --release -p ferndpi-android --target aarch64-linux-android
          cargo build --release -p ferndpi-android --target armv7-linux-androideabi
          cargo build --release -p ferndpi-android --target x86_64-linux-android

      - name: Build tun2socks (hev-socks5-tunnel)
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          cd /tmp/hev
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" APP_MODULES=hev-socks5-tunnel -j"$(nproc)"
          find libs -name "*.so" -print

      - name: Fetch latest Flowseal configs
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/flowseal/zapret-discord-youtube /tmp/flowseal
          mkdir -p android/app/src/main/assets/flowseal
          cp /tmp/flowseal/*.bat android/app/src/main/assets/flowseal/
          cp -r /tmp/flowseal/lists android/app/src/main/assets/flowseal/lists
          if [ -d /tmp/flowseal/bin ]; then
            cp -r /tmp/flowseal/bin android/app/src/main/assets/flowseal/bin
          fi
          ls android/app/src/main/assets/flowseal

      - name: Bundle core binaries as native libs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
          done
          cp target/aarch64-linux-android/release/ferndpi android/app/src/main/jniLibs/arm64-v8a/libferndpi.so
          cp target/armv7-linux-androideabi/release/ferndpi android/app/src/main/jniLibs/armeabi-v7a/libferndpi.so
          cp target/x86_64-linux-android/release/ferndpi android/app/src/main/jniLibs/x86_64/libferndpi.so

          cp target/aarch64-linux-android/release/libferndpi_android.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libferndpi_android.so android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libferndpi_android.so android/app/src/main/jniLibs/x86_64/

          cp /tmp/hev/libs/arm64-v8a/libhev-socks5-tunnel.so android/app/src/main/jniLibs/arm64-v8a/
          cp /tmp/hev/libs/armeabi-v7a/libhev-socks5-tunnel.so android/app/src/main/jniLibs/armeabi-v7a/
          cp /tmp/hev/libs/x86_64/libhev-socks5-tunnel.so android/app/src/main/jniLibs/x86_64/

          ls -la android/app/src/main/jniLibs/*/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug + release)
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Sign release APK (optional)
        if: env.RELEASE_KEYSTORE_B64 != ''
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          APK=$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -n1)
          SIGNED="${APK%-unsigned.apk}.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$SIGNED" "$APK"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "$SIGNED"
          rm -f "$RUNNER_TEMP/release.jks" "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FernDPI-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FernDPI-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
